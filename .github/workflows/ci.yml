# CI: a cada push na main e a cada pull request.
# Checa tipos, compila, roda os testes (núcleo, CLI e servidor MCP) em Linux, Windows e macOS,
# e confere que o pacote do npm instala e roda de verdade.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo cancela a execução anterior do mesmo branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Os testes usam data/models.json do próprio commit, não a tabela publicada na main.
env:
  NEURIX_OFFLINE: "1"

jobs:
  test:
    name: Test · ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # versão vem do "packageManager" do package.json

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  package:
    name: Package (npm pack + install)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Pack
        run: |
          npm pack
          echo "Conteúdo do pacote:"
          tar -tzf aspael-neurix-*.tgz

      - name: npx can find the executable
        # Mesma função que o npx usa: com vários executáveis, um precisa ter o nome do pacote.
        run: node scripts/check-npx.mjs

      - name: Install the tarball and run the binaries
        run: |
          npm install -g ./aspael-neurix-*.tgz
          test "$(neurix --version)" = "$(node -p "require('./package.json').version")"
          neurix --usd 5 -m gpt-6.1-sol "hello world"
          # o servidor MCP precisa responder a um initialize via stdio
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 20 neurix-mcp | head -n 1 | grep -q '"serverInfo"'
          echo "neurix e neurix-mcp OK"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: aspael-neurix-*.tgz
          retention-days: 7
