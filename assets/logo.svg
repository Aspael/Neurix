<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220">
  <title>Neurix — LLM token calculator</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".45" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- cérebro -->
  <g transform="translate(16 24)">
    <g fill="url(#g)" fill-opacity=".08" stroke="url(#g)" stroke-width="7" stroke-linejoin="round">
      <path d="M94 12 C66 -2 32 8 24 34 C4 40 -2 70 12 86 C0 104 10 134 36 138 C44 158 76 164 94 148 Z"/>
      <path d="M106 12 C134 -2 168 8 176 34 C196 40 202 70 188 86 C200 104 190 134 164 138 C156 158 124 164 106 148 Z"/>
    </g>
    <rect x="94" y="150" width="12" height="22" rx="5" fill="url(#g)"/>
    <g fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".75">
      <path d="M44 48 L72 38 L82 70 L48 86 L62 116 L84 108"/>
      <path d="M156 48 L128 38 L118 70 L152 86 L138 116 L116 108"/>
      <path d="M82 70 L118 70"/>
      <path d="M84 108 L116 108"/>
    </g>
    <g fill="#facc15" filter="url(#glow)">
      <circle cx="44" cy="48" r="6"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="72" cy="38" r="5"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin=".3s" repeatCount="indefinite"/></circle>
      <circle cx="82" cy="70" r="6.5"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin=".6s" repeatCount="indefinite"/></circle>
      <circle cx="48" cy="86" r="5"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin=".9s" repeatCount="indefinite"/></circle>
      <circle cx="62" cy="116" r="5.5"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="84" cy="108" r="6"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="156" cy="48" r="6"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin=".15s" repeatCount="indefinite"/></circle>
      <circle cx="128" cy="38" r="5"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin=".45s" repeatCount="indefinite"/></circle>
      <circle cx="118" cy="70" r="6.5"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin=".75s" repeatCount="indefinite"/></circle>
      <circle cx="152" cy="86" r="5"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin="1.05s" repeatCount="indefinite"/></circle>
      <circle cx="138" cy="116" r="5.5"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin="1.35s" repeatCount="indefinite"/></circle>
      <circle cx="116" cy="108" r="6"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin="1.65s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- nome -->
  <text x="248" y="128" fill="url(#word)" font-family="ui-sans-serif, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="6">NEURIX</text>
  <text x="252" y="172" fill="#8b949e" font-family="ui-sans-serif, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="1">LLM token calculator · cost · RAG · VRAM</text>
</svg>
