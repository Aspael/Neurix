4.4" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M364.40000000000003 357.5H372.8" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M372.8 357.5H381.2" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M381.2 357.5H389.59999999999997" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M389.6 357.5H398" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M398 357.5H406.4" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M406.40000000000003 357.5H414.8" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M414.8 357.5H423.2" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M423.20000000000005 357.5H431.6" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M431.6 357.5H440" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M440 357.5H448.4" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M448.40000000000003 357.5H456.8" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M456.8 357.5H465.2" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M465.20000000000005 357.5H473.6" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M473.6 357.5H482" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M482 357.5H490.4" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><text y="362"></text>
    <text y="381"><tspan x="20.0" fill="#d4d4d8" opacity="0.6">Custo entrada:</tspan><tspan x="171.2" fill="#d4d4d8">US$ 0,00007</tspan><tspan x="280.4" fill="#d4d4d8" opacity="0.6">|</tspan><tspan x="305.6" fill="#d4d4d8">R$ 0,000378</tspan></text>
    <text y="400"><tspan x="171.2" fill="#d4d4d8" font-style="italic" opacity="0.6">↳ Entrada (input) é tudo que você envia: o texto, as</tspan></text>
    <text y="419"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">instruções e o histórico da conversa. Conta: tokens de</tspan></text>
    <text y="438"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">entrada ÷ 1.000.000 × preço por 1M.</tspan></text>
    <text y="457"><tspan x="20.0" fill="#d4d4d8" opacity="0.6">Custo saída:</tspan><tspan x="171.2" fill="#d4d4d8">~US$ 0,003</tspan><tspan x="272.0" fill="#d4d4d8" opacity="0.6">|</tspan><tspan x="297.2" fill="#d4d4d8">R$ 0,0162</tspan><tspan x="389.6" fill="#d4d4d8" opacity="0.6">(resposta ~300 tokens)</tspan></text>
    <text y="476"><tspan x="171.2" fill="#d4d4d8" font-style="italic" opacity="0.6">↳ Saída (output) é a resposta que o modelo escreve. Costuma</tspan></text>
    <text y="495"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">ser 3 a 5× mais cara que a entrada. Como a resposta ainda</tspan></text>
    <text y="514"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">não existe, o Neurix supõe um tamanho (padrão: 300 tokens;</tspan></text>
    <text y="533"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">mude com --out).</tspan></text>
    <text y="552"><tspan x="20.0" fill="#d4d4d8" opacity="0.6">Total previsto:</tspan><tspan x="171.2" fill="#d4d4d8" font-weight="700">~US$ 0,00307</tspan><tspan x="288.8" fill="#d4d4d8" opacity="0.6">|</tspan><tspan x="314.0" fill="#4ade80" font-weight="700">~R$ 0,0166</tspan></text>
    <text y="571"><tspan x="171.2" fill="#d4d4d8" font-style="italic" opacity="0.6">↳ Entrada + saída: quanto deve custar UMA chamada ao modelo</tspan></text>
    <text y="590"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">com esse texto.</tspan></text>
    <text y="609"><tspan x="20.0" fill="#d4d4d8" opacity="0.6">Contexto:</tspan><tspan x="171.2" fill="#4ade80">✅ cabe (335 / 1.000.000 · &lt;0,1% da janela)</tspan></text>
    <text y="628"><tspan x="171.2" fill="#d4d4d8" font-style="italic" opacity="0.6">↳ Janela de contexto é o máximo de tokens que o modelo</tspan></text>
    <text y="647"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">enxerga de uma vez — entrada E resposta somadas. Se passar</tspan></text>
    <text y="666"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">do limite, a API recusa o pedido ou corta o texto.</tspan></text>
    <text y="685"><tspan x="20.0" fill="#d4d4d8" opacity="0.6">Câmbio:</tspan><tspan x="171.2" fill="#d4d4d8" opacity="0.6">US$ 1 = R$ 5,40 · informada pelo usuário</tspan></text>
    <text y="704"><tspan x="171.2" fill="#d4d4d8" font-style="italic" opacity="0.6">↳ Cotação usada para converter dólar em real. Os provedores</tspan></text>
    <text y="723"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">cobram em dólar; o cartão aplica o câmbio do dia e, em</tspan></text>
    <text y="742"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">geral, IOF.</tspan></text>
  </g>
</svg>
