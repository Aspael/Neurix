    <text y="115"><tspan x="20.0" fill="#d4d4d8" opacity="0.6">Texto:</tspan><tspan x="171.2" fill="#d4d4d8">120 caracteres</tspan></text>
    <text y="134"><tspan x="171.2" fill="#d4d4d8" font-style="italic" opacity="0.6">↳ Quantidade de letras, espaços e sinais. É o que você vê — o</tspan></text>
    <text y="153"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">modelo não lê caracteres, lê tokens.</tspan></text>
    <text y="172"><tspan x="20.0" fill="#d4d4d8" opacity="0.6">Tokens:</tspan><tspan x="171.2" fill="#d4d4d8">~35 </tspan><tspan x="204.8" fill="#d4d4d8" opacity="0.6">(estimativa chars/3,5)</tspan></text>
    <text y="191"><tspan x="171.2" fill="#d4d4d8" font-style="italic" opacity="0.6">↳ Token é o pedaço de texto que o modelo realmente lê: uma</tspan></text>
    <text y="210"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">palavra curta, parte de uma palavra longa ou um sinal. Você</tspan></text>
    <text y="229"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">paga por token. O Neurix estima 1 token a cada ~3,5</tspan></text>
    <text y="248"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">caracteres (média do português); cada modelo conta um pouco</tspan></text>
    <text y="267"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">diferente, então considere ±10%.</tspan></text>
    <text y="286"><tspan x="20.0" fill="#d4d4d8" opacity="0.6">Modelo:</tspan><tspan x="171.2" fill="#d4d4d8">Claude Sonnet 5.5 </tspan><tspan x="322.4" fill="#d4d4d8" opacity="0.6">(claude-sonnet-5-5)</tspan></text>
    <text y="305"><tspan x="171.2" fill="#d4d4d8" font-style="italic" opacity="0.6">↳ O modelo escolhido. Cada um tem seu preço por token e seu</tspan></text>
    <text y="324"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">tamanho de janela de contexto.</tspan></text>
    <text y="343"><tspan x="20.0" fill="#d4d4d8" opacity="0.6">Preço por 1M:</tspan><tspan x="171.2" fill="#d4d4d8">entrada US$ 2,00 · saída US$ 10,00</tspan></text>
