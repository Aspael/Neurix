    <text y="115"><tspan x="20.0" fill="#d4d4d8" opacity="0.6">Text:</tspan><tspan x="171.2" fill="#d4d4d8">110 characters</tspan></text>
    <text y="134"><tspan x="171.2" fill="#d4d4d8" font-style="italic" opacity="0.6">↳ Number of letters, spaces and symbols. It's what you see —</tspan></text>
    <text y="153"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">the model doesn't read characters, it reads tokens.</tspan></text>
    <text y="172"><tspan x="20.0" fill="#d4d4d8" opacity="0.6">Tokens:</tspan><tspan x="171.2" fill="#d4d4d8">~32 </tspan><tspan x="204.8" fill="#d4d4d8" opacity="0.6">(estimate chars/3.5)</tspan></text>
    <text y="191"><tspan x="171.2" fill="#d4d4d8" font-style="italic" opacity="0.6">↳ A token is the piece of text the model actually reads: a</tspan></text>
    <text y="210"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">short word, part of a long word, or a symbol. You pay per</tspan></text>
    <text y="229"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">token. Neurix estimates 1 token every ~3.5 characters</tspan></text>
    <text y="248"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">(tuned for Portuguese; English is usually ~4); each model</tspan></text>
    <text y="267"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">counts a bit differently, so allow ±10%.</tspan></text>
    <text y="286"><tspan x="20.0" fill="#d4d4d8" opacity="0.6">Model:</tspan><tspan x="171.2" fill="#d4d4d8">Claude Sonnet 5.5 </tspan><tspan x="322.4" fill="#d4d4d8" opacity="0.6">(claude-sonnet-5-5)</tspan></text>
    <text y="305"><tspan x="171.2" fill="#d4d4d8" font-style="italic" opacity="0.6">↳ The chosen model. Each one has its own price per token and</tspan></text>
    <text y="324"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">its own context window size.</tspan></text>
    <text y="343"><tspan x="20.0" fill="#d4d4d8" opacity="0.6">Price per 1M:</tspan><tspan x="171.2" fill="#d4d4d8">input $2.00 · output $10.00</tspan></text>
