y="0.6"/><path d="M188 357.5H196.4" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M196.4 357.5H204.8" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M204.8 357.5H213.20000000000002" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M213.20000000000002 357.5H221.60000000000002" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M221.60000000000002 357.5H230.00000000000003" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M230 357.5H238.4" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M238.4 357.5H246.8" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M246.8 357.5H255.20000000000002" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M255.20000000000002 357.5H263.6" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M263.6 357.5H272" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M272 357.5H280.4" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M280.40000000000003 357.5H288.8" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M288.8 357.5H297.2" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M297.2 357.5H305.59999999999997" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M305.6 357.5H314" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M314 357.5H322.4" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M322.40000000000003 357.5H330.8" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M330.8 357.5H339.2" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M339.2 357.5H347.59999999999997" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M347.6 357.5H356" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M356 357.5H364.4" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M364.40000000000003 357.5H372.8" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M372.8 357.5H381.2" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M381.2 357.5H389.59999999999997" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M389.6 357.5H398" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M398 357.5H406.4" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M406.40000000000003 357.5H414.8" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M414.8 357.5H423.2" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M423.20000000000005 357.5H431.6" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M431.6 357.5H440" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M440 357.5H448.4" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M448.40000000000003 357.5H456.8" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M456.8 357.5H465.2" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M465.20000000000005 357.5H473.6" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M473.6 357.5H482" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><path d="M482 357.5H490.4" fill="none" stroke="#d4d4d8" stroke-width="1.3" opacity="0.6"/><text y="362"></text>
    <text y="381"><tspan x="20.0" fill="#d4d4d8" opacity="0.6">Input cost:</tspan><tspan x="171.2" fill="#d4d4d8">$0.000064</tspan><tspan x="263.6" fill="#d4d4d8" opacity="0.6">|</tspan><tspan x="288.8" fill="#d4d4d8">R$0.000346</tspan></text>
    <text y="400"><tspan x="171.2" fill="#d4d4d8" font-style="italic" opacity="0.6">↳ Input is everything you send: the text, the instructions</tspan></text>
    <text y="419"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">and the conversation history. Math: input tokens ÷</tspan></text>
    <text y="438"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">1,000,000 × price per 1M.</tspan></text>
    <text y="457"><tspan x="20.0" fill="#d4d4d8" opacity="0.6">Output cost:</tspan><tspan x="171.2" fill="#d4d4d8">~$0.003</tspan><tspan x="246.8" fill="#d4d4d8" opacity="0.6">|</tspan><tspan x="272.0" fill="#d4d4d8">R$0.0162</tspan><tspan x="356.0" fill="#d4d4d8" opacity="0.6">(answer ~300 tokens)</tspan></text>
    <text y="476"><tspan x="171.2" fill="#d4d4d8" font-style="italic" opacity="0.6">↳ Output is the answer the model writes. It usually costs 3</tspan></text>
    <text y="495"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">to 5× more than input. Since the answer doesn't exist yet,</tspan></text>
    <text y="514"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">Neurix assumes a size (default: 300 tokens; change it with</tspan></text>
    <text y="533"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">--out).</tspan></text>
    <text y="552"><tspan x="20.0" fill="#d4d4d8" opacity="0.6">Expected total:</tspan><tspan x="171.2" fill="#d4d4d8" font-weight="700">~$0.00306</tspan><tspan x="263.6" fill="#d4d4d8" opacity="0.6">|</tspan><tspan x="288.8" fill="#4ade80" font-weight="700">~R$0.0165</tspan></text>
    <text y="571"><tspan x="171.2" fill="#d4d4d8" font-style="italic" opacity="0.6">↳ Input + output: what ONE call to the model with this text</tspan></text>
    <text y="590"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">should cost.</tspan></text>
    <text y="609"><tspan x="20.0" fill="#d4d4d8" opacity="0.6">Context:</tspan><tspan x="171.2" fill="#4ade80">✅ fits (332 / 1,000,000 · &lt;0.1% of the window)</tspan></text>
    <text y="628"><tspan x="171.2" fill="#d4d4d8" font-style="italic" opacity="0.6">↳ The context window is the maximum number of tokens the</tspan></text>
    <text y="647"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">model can see at once — input AND output combined. Go over</tspan></text>
    <text y="666"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">it and the API rejects the request or truncates the text.</tspan></text>
    <text y="685"><tspan x="20.0" fill="#d4d4d8" opacity="0.6">Exchange:</tspan><tspan x="171.2" fill="#d4d4d8" opacity="0.6">US$ 1 = R$ 5.40 · set by the user</tspan></text>
    <text y="704"><tspan x="171.2" fill="#d4d4d8" font-style="italic" opacity="0.6">↳ Exchange rate used to convert dollars to reais. Providers</tspan></text>
    <text y="723"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">bill in dollars; Brazilian cards apply the day's rate and</tspan></text>
    <text y="742"><tspan x="188.0" fill="#d4d4d8" font-style="italic" opacity="0.6">usually IOF tax.</tspan></text>
  </g>
</svg>
